name: MiniApp
options:
  bundleIdPrefix: com.aire
  deploymentTarget:
    iOS: 17.0
targets:
  MiniApp:
    type: application
    platform: iOS
    sources: [MiniApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aire.miniapp
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SWIFT_VERSION: "5.0"
schemes:
  MiniApp:
    build:
      targets:
        MiniApp: all
    run:
      config: Debug
    archive:
      config: Release
